<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/MulReportCND/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplicativo de Inspección y Reportes Técnicos CND">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MulReport CND">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MulReport CND</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js')
          .then(function (reg) {
            console.log('CND PWA Service Worker registered:', reg.scope);
          })
          .catch(function (err) {
            console.warn('CND PWA Service Worker registration error:', err);
          });
      });
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #FFFFFF;
      user-select: none;
      transition: opacity 0.4s ease-out;
    }

    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: rgba(30, 58, 138, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }

    .logo-icon {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
    }

    .logo-icon svg {
      width: 34px;
      height: 34px;
      fill: #FFFFFF;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
      color: #F8FAFC;
    }

    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin: 0 0 28px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-container">
      <div class="logo-pulse"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm-4 8H7v-2h6v2z"/>
        </svg>
      </div>
    </div>
    <h1 class="app-title">MulReport CND</h1>
    <p class="app-subtitle">Cargando aplicativo...</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
